<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Chamba al Toque</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/inicio.css}" href="/css/inicio.css" />
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css" />
    <script th:src="@{/js/login.js}" src="/js/login.js" defer></script>
</head>
<body style="background-color: #F8FAFC; min-height: 100vh;" class="d-flex flex-column"
        th:data-tipo-activo="${tipoActivo} ?: 'usuario'">

    <nav th:replace="layouts :: navbar"></nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="login-card p-4 p-md-5 shadow-sm border border-0">

            <div class="text-center mb-4">
                <div class="icon-lock-box mb-3 shadow-sm">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h1 class="fw-bold h3 text-dark mb-1">Iniciar sesión</h1>
                <p class="text-muted small">Bienvenido de vuelta a Chamba al Toque</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small text-center" th:text="${error}"></div>

            <div class="toggle-container mb-4">
                <button type="button" id="btnTipoUsuario" class="toggle-btn">Usuario</button>
                <button type="button" id="btnTipoFreelancer" class="toggle-btn">Freelancer</button>
            </div>

            <form id="formLoginUsuario" th:action="@{/login/usuario}" method="post">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Correo electrónico</label>
                    <div class="form-control-icon">
                        <i class="bi bi-envelope prefix-icon"></i>
                        <input type="email" name="correo" class="form-control" placeholder="tu@email.com" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Contraseña</label>
                    <div class="form-control-icon">
                        <i class="bi bi-lock prefix-icon"></i>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
                        <i class="bi bi-eye suffix-icon" onclick="togglePassword(this)"></i>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="recordarmeUsuario">
                        <label class="form-check-input-label text-muted" for="recordarmeUsuario">Recordarme</label>
                    </div>
                    <a href="#" class="text-green-link">Olvidé mi contraseña</a>
                </div>

            </form>

            <form id="formLoginFreelancer" th:action="@{/login/freelancer}" method="post" style="display:none">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Correo electrónico</label>
                    <div class="form-control-icon">
                        <i class="bi bi-envelope prefix-icon"></i>
                        <input type="email" name="correo" class="form-control" placeholder="tu@email.com" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Contraseña</label>
                    <div class="form-control-icon">
                        <i class="bi bi-lock prefix-icon"></i>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
                        <i class="bi bi-eye suffix-icon" onclick="togglePassword(this)"></i>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="recordarmeFreelancer">
                        <label class="form-check-input-label text-muted" for="recordarmeFreelancer">Recordarme</label>
                    </div>
                    <a href="#" class="text-green-link">Olvidé mi contraseña</a>
                </div>

            </form>

            <div class="d-grid mb-4 mt-2">
                <button type="button" id="btnIniciar" class="btn btn-primary btn-lg rounded-pill py-2 fw-bold">
                    Iniciar sesión
                </button>
            </div>

            <div class="text-center small text-muted">
                ¿No tienes cuenta? <a th:href="@{/registro}" href="/registro" class="text-green-link">Regístrate aquí</a>
            </div>

        </div>
    </main>

    <footer th:replace="layouts :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
