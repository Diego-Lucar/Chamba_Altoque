<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Chamba al Toque</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
    <link rel="stylesheet" th:href="@{/css/perfil.css}" href="/css/perfil.css" />
</head>
<body style="background-color: #f3f1f196;">

    <header th:replace="~{layouts :: navbar}"></header>

    <main class="container my-5" style="max-width: 960px;">
        <div class="profile-banner p-4 mb-4 text-white d-flex align-items-center position-relative shadow-sm" 
             style="background: linear-gradient(135deg, #1E3A8A 0%, #10B981 100%); min-height: 180px;">
        
            
            <div class="d-flex flex-column flex-md-row align-items-center gap-4 w-100">
                <div class="position-relative">
                    <div class="rounded-circle bg-white bg-opacity-25 border border-2 border-white d-flex align-items-center justify-content-center text-white fw-bold shadow" 
                         style="width: 110px; height: 110px; font-size: 2.25rem;">
                        JP
                    </div>
                    <button type="button" class="btn btn-light btn-sm rounded-circle position-absolute bottom-0 end-0 d-flex align-items-center justify-content-center p-2 shadow-sm" style="width: 32px; height: 32px;">
                        <i class="bi bi-camera-fill text-dark"></i>
                    </button>
                </div>
                <div class="text-center text-md-start">
                    <h2 class="fw-bold m-0" th:text="${usuario.nombre}">Juan Pérez</h2>
                    <p class="mb-1 text-white-50 small" th:text="${usuario.correo}">juan.perez@email.com</p>
                    <p class="m-0 small"><i class="bi bi-geo-alt-fill me-1"></i>Miraflores</p>
                </div>
            </div>
        </div>

        <div th:if="${param.successInfo}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> Información personal actualizada correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${param.successPassword}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> La contraseña ha sido cambiada de forma segura.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-3 p-4 p-md-5 bg-white mb-4">
            <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
                <h3 class="fw-bold h4 text-dark m-0">Información Personal</h3>
                <i class="bi bi-person-lines-fill fs-4 text-muted"></i>
            </div>
            
            <form th:action="@{/perfil/actualizar-info}" th:object="${usuario}" method="POST">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Nombre completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" th:field="*{nombre}" class="form-control bg-light border-start-0" placeholder="Ej. Juan Pérez" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Correo electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" th:field="*{correo}" class="form-control bg-light border-start-0" placeholder="tu@correo.com" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Teléfono</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="text" th:field="*{telefono}" class="form-control bg-light border-start-0" placeholder="+51 999 999 999" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Distrito</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                            <select th:field="*{distrito}" class="form-select bg-light border-start-0" required>
                                <option value="" disabled selected>Selecciona tu distrito</option>
                                <option th:each="dist : ${distritos}" th:value="${dist.id}" th:text="${dist.nombre}">Miraflores</option>
                                <option value="1" th:if="${#lists.isEmpty(distritos)}">Miraflores (Defecto)</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold rounded-2" style="background-color: #1E3A8A; border: none;">
                            <i class="bi bi-floppy me-2"></i>Guardar Información
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card border-0 shadow-sm rounded-3 p-4 p-md-5 bg-white">
            <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
                <h3 class="fw-bold h4 text-dark m-0">Cambiar contraseña</h3>
                <i class="bi bi-shield-lock-fill fs-4 text-muted"></i>
            </div>
            
            <form th:action="@{/perfil/actualizar-password}" method="POST">
                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label small fw-bold text-secondary">Contraseña actual</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" name="passwordActual" class="form-control bg-light border-start-0" placeholder="Introduce tu contraseña actual" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Nueva contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="nuevoPassword" class="form-control bg-light border-start-0" placeholder="Mínimo 6 caracteres" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Confirmar contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check-all"></i></span>
                            <input type="password" name="confirmarPassword" class="form-control bg-light border-start-0" placeholder="Repite tu nueva contraseña" required />
                        </div>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-success px-4 fw-semibold rounded-2" style="background-color: #10B981; border: none;">
                            <i class="bi bi-key me-2"></i>Actualizar Contraseña
                        </button>
                    </div>
                </div>
            </form>
        </div>

    </main>

    <footer th:replace="~{layouts :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
