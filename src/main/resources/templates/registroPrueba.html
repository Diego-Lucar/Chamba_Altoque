<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form
      class="form-group-list was-validated"
      th:action="@{/guardar}"
      th:object="${usuario}"
      method="post"
    >
      <div>
        <label class="form-label">Nombre completo</label>
        <div class="input-container">
          <span class="input-icon-left"
            ><svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" /></svg
          ></span>
          <input
            type="text"
            th:field="*{nombre}"
            placeholder="Tu nombre completo"
            class="form-input"
            required
          />
        </div>
      </div>
      <div>
        <label class="form-label">Correo electrónico</label>
        <div class="input-container">
          <span class="input-icon-left"
            ><svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="M2 7l10 7 10-7" /></svg
          ></span>
          <input
            type="email"
            th:field="*{correo}"
            placeholder="tu@email.com"
            class="form-input"
          />
        </div>
      </div>
      <div>
        <label class="form-label">Teléfono</label>
        <div class="input-container">
          <span class="input-icon-left"
            ><svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.77a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              /></svg
          ></span>
          <input
            type="tel"
            th:field="*{telefono}"
            placeholder="+51 999 999 999"
            class="form-input"
          />
        </div>
      </div>
      <div>
        <label class="form-label">Distrito (Lima)</label>
        <div class="input-container">
          <span class="input-icon-left"
            ><svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
              /></svg
          ></span>
          <select class="form-select" th:field="*{distrito}">
            <option value="">Selecciona tu distrito</option>
            <option
              th:each="distrito : ${distritos}"
              th:value="${distrito.id}"
              th:text="${distrito.nombre}"
            ></option>
          </select>
        </div>
      </div>
      <div>
        <label class="form-label">Contraseña</label>
        <div class="input-container">
          <span class="input-icon-left"
            ><svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg
          ></span>
          <input
            th:field="*{password}"
            type="password"
            id="passInputProv"
            placeholder="••••••••"
            class="form-input form-input-pass"
            required
          />
          <span onclick="togglePass('passInputProv')" class="input-icon-right">
            <svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </span>
        </div>
      </div>
      <div>
        <label class="form-label">Confirmar contraseña</label>
        <div class="input-container">
          <span class="input-icon-left"
            ><svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg
          ></span>
          <input type="password" placeholder="••••••••" class="form-input" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>
  </body>
</html>
